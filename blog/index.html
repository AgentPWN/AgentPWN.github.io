<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog · Rupak Banerjee</title>
  <meta name="description" content="Notes on what I'm learning. Rough, honest, and updated as I go." />
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="blog.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="nav is-scrolled">
    <div class="container nav__inner">
      <a href="../index.html" class="brand">
        <span class="brand__mark">◆</span>
        <span class="brand__name">Rupak Banerjee</span>
      </a>
      <nav class="nav__links" aria-label="Primary">
        <a href="../index.html#projects">Projects</a>
        <a href="../index.html#learning">Learning</a>
        <a href="../index.html#contact" class="nav__cta">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container blog-index">
    <a class="post-page__back" href="../index.html">← Home</a>
    <header class="blog-index__head">
      <h1>Blog</h1>
      <p>Notes on what I'm learning or find interesting.</p>
    </header>
    <div id="postList" class="post-list">
      <p class="post-list__empty">Loading posts…</p>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>© <span id="year"></span> Rupak Banerjee</span>
      <a href="../index.html#top" class="footer__top">Home ↑</a>
    </div>
  </footer>

  <script src="blog.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    (async function () {
      const list = document.getElementById("postList");
      try {
        const posts = await fetch("posts.json").then((r) => r.json());
        posts.sort((a, b) => (a.date < b.date ? 1 : a.date > b.date ? -1 : 0));
        if (!posts.length) {
          list.innerHTML = '<p class="post-list__empty">No posts yet.</p>';
          return;
        }
        list.innerHTML = posts
          .map(function (p) {
            return (
              '<a class="post-item" href="post.html?p=' + encodeURIComponent(p.slug) + '">' +
              '<span class="post-item__date">' + fmtDate(p.date) + "</span>" +
              '<h2 class="post-item__title">' + escapeHtml(p.title) + "</h2>" +
              '<p class="post-item__excerpt">' + escapeHtml(p.excerpt || "") + "</p>" +
              '<span class="post-item__more">Read →</span>' +
              "</a>"
            );
          })
          .join("");
      } catch (e) {
        list.innerHTML =
          '<p class="post-list__empty">Could not load posts. If you are viewing this from a file on disk, run a local server (see the README) or view it on the live site.</p>';
      }
    })();
  </script>
</body>
</html>
