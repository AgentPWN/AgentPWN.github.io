<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Blog · Rupak Banerjee</title>
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="post.css" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>◆</text></svg>" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow" aria-hidden="true"></div>

  <header class="nav is-scrolled">
    <div class="container nav__inner">
      <a href="../index.html" class="brand">
        <span class="brand__mark">◆</span>
        <span class="brand__name">Rupak Banerjee</span>
      </a>
      <nav class="nav__links" aria-label="Primary">
        <a href="index.html">Blog</a>
        <a href="../index.html#contact" class="nav__cta">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container post-page">
    <a class="post-page__back" href="index.html">← All posts</a>
    <article>
      <header class="post-page__header">
        <span class="post__date" id="postDate"></span>
        <h1 id="postTitle">Loading…</h1>
      </header>
      <div class="prose" id="postBody"></div>
    </article>
    <footer class="post-page__foot">
      <a class="btn btn--ghost" href="index.html">← Back to all posts</a>
    </footer>
  </main>

  <footer class="footer">
    <div class="container footer__inner">
      <span>© <span id="year"></span> Rupak Banerjee</span>
      <a href="../index.html#top" class="footer__top">Home ↑</a>
    </div>
  </footer>

  <script src="blog.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    (async function () {
      const params = new URLSearchParams(location.search);
      const slug = params.get("p");
      const title = document.getElementById("postTitle");
      const dateEl = document.getElementById("postDate");
      const body = document.getElementById("postBody");
      if (!slug) {
        title.textContent = "Post not found";
        body.innerHTML = "<p>No post was specified.</p>";
        return;
      }
      try {
        const posts = await fetch("posts.json").then((r) => r.json());
        const meta = posts.find((p) => p.slug === slug);
        const md = await fetch("posts/" + slug + ".md").then((r) => {
          if (!r.ok) throw new Error("not found");
          return r.text();
        });
        if (meta) {
          title.textContent = meta.title;
          document.title = meta.title + " · Rupak Banerjee";
          dateEl.textContent = fmtDate(meta.date);
        }
        body.innerHTML = mdToHtml(md);
      } catch (e) {
        title.textContent = "Post not found";
        body.innerHTML =
          "<p>Could not load this post. If you are viewing from a file on disk, run a local server (see the README) or view it on the live site.</p>";
      }
    })();
  </script>
</body>
</html>
